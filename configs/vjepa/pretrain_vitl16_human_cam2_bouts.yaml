# V-JEPA pretrain on human cam2 walking bouts only.
#
# Build the bout-expanded index (one row per bout with start/end frames):
#   conda activate myenv
#   python scripts/prepare_vjepa_bout_csv.py \
#     --index-csv /rhomes/gschum/jepa/trainCSV/human_cam2.csv \
#     --bout-csv /rhomes/gschum/AgePredictionHumanGait/outputs/walking_bouts_frames.csv \
#     --output /rhomes/gschum/jepa/trainCSV/human_cam2_bouts.csv \
#     --min-bout-frames 64
#
# Launch:
#   python -m app.main \
#     --fname configs/vjepa/pretrain_vitl16_human_cam2_bouts.yaml \
#     --devices cuda:0

app: vjepa
nodes: 1
tasks_per_node: 1

data:
  dataset_type: VideoDataset
  datasets:
    - /rhomes/gschum/jepa/trainCSV/human_cam2_bouts.csv
  decode_one_clip: true
  batch_size: 24
  num_clips: 1
  num_frames: 16
  tubelet_size: 2
  sampling_rate: 4
  crop_size: 224
  patch_size: 16
  pin_mem: true
  num_workers: 8
  # Skip bouts shorter than clip_len (= num_frames * sampling_rate).
  filter_short_videos: true
  clip_duration: null

data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
    - 0.75
    - 1.35
  random_resize_scale:
    - 0.3
    - 1.0
  reprob: 0.0

logging:
  folder: /rhomes/gschum/jepa/outputs/vjepa_pretrain_human_cam2_bouts
  write_tag: human_cam2_bouts_vjepa_vitl16

loss:
  loss_exp: 1.0
  reg_coeff: 0.0

mask:
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 8
    spatial_scale:
      - 0.15
      - 0.15
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null
  - aspect_ratio:
      - 0.75
      - 1.5
    num_blocks: 2
    spatial_scale:
      - 0.7
      - 0.7
    temporal_scale:
      - 1.0
      - 1.0
    max_temporal_keep: 1.0
    max_keep: null

meta:
  load_checkpoint: false
  read_checkpoint: null
  seed: 234
  eval_freq: 100
  use_sdpa: true
  dtype: bfloat16

model:
  model_name: vit_large
  pred_depth: 12
  pred_embed_dim: 384
  uniform_power: true
  use_mask_tokens: true
  zero_init_mask_tokens: true

optimization:
  ipe: null
  ipe_scale: 1.25
  clip_grad: 10.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  epochs: 300
  warmup: 40
  start_lr: 0.0002
  lr: 0.000625
  final_lr: 1.0e-06
  ema:
    - 0.998
    - 1.0
